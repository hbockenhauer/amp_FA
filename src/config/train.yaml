defaults: 
  - model: centerpoint_radar
  - _self_

seed: 47020

exp_id: ${model.name}_ep_${epochs}

data_root: data/view_of_delft
output_dir: outputs/${exp_id}

checkpoint_path:

class_namses: ['Car', 'Pedestrian', 'Cyclist']
# trainer:
num_workers: 2
gpus: [0] # will change in code: torch.cuda.device_count()
sync_bn: true
batch_size: 2
epochs: 50

# log settings
log_every: 50
val_every: 3
save_top_model: 5

early_stopping:
  enabled: true
  monitor: validation/entire_area/mAP
  mode: max
  # With val_every=2, patience=2 allows ~4 extra epochs before stopping.
  patience: 2
  min_delta: 0.0
  strict: true

# Prevent jobs from hanging forever in online W&B teardown.
wandb_finish_timeout_s: 20
force_exit_on_wandb_hang: true



